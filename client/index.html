<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMS — Stock Analysis & Prediction</title>
  <link rel="stylesheet" href="src/css/base.css">
  <link rel="stylesheet" href="src/css/header.css">
  <link rel="stylesheet" href="src/css/search.css">
  <link rel="stylesheet" href="src/css/layout.css">
  <link rel="stylesheet" href="src/css/cards.css">
  <link rel="stylesheet" href="src/css/responsive.css">
</head>
<body>
  <header class="site-header">
    <h1 class="page-title"><a href="index.html" class="site-logo">SAMS</a></h1>
    <nav class="auth-nav" id="auth-nav"></nav>
  </header>
  <div class="search-wrapper">
    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="Search ticker e.g. AAPL" autocomplete="off">
    </div>
  </div>
  <main class="container">
    <div class="result-count" id="result-count">Enter a ticker and press Enter to forecast — same search shell as Bibliotheca.</div>
    <div class="card-grid" id="card-grid"></div>
    <div id="forecast-panel" style="display:none; margin-top: 32px; background:#fff; border:1px solid #ddd; border-radius:8px; padding:24px;"></div>
  </main>
  <script src="src/auth.js"></script>
  <script src="src/nav.js"></script>
  <script src="src/state.js"></script>
  <script src="src/renderStocks.js"></script>
  <script src="src/onSearch.js"></script>
  <script src="src/searchEventHandlers.js"></script>
  <script src="src/init.js"></script>
</body>
</html>
