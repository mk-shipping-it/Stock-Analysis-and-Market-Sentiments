<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - SAMS</title>
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>
<header class="site-header">
  <h1 class="page-title"><a href="index.html" class="site-logo">SAMS</a></h1>
  <nav class="auth-nav" id="auth-nav"></nav>
</header>
<div class="container">
  <h2 style="margin-bottom:8px;">Operations overview</h2>
  <p style="color:#666; font-size:0.9rem; margin-bottom:24px;">Google auth + role check.</p>
  <div class="stats">
    <div class="stat"><div class="label">Users</div><div class="value" id="user-count">…</div></div>
    <div class="stat"><div class="label">Companies</div><div class="value" id="company-count">…</div></div>
  </div>
  <div id="admin-msg"></div>
</div>
<script src="src/auth.js"></script>
<script src="src/nav.js"></script>
<script>
const auth = getAuth()
if (!auth || auth.user.role !== 'admin'){
  document.querySelector('.container').innerHTML = '<div class="not-admin"><h2>Admins only</h2><p><a href="index.html" style="color:#2D4475;">Go home</a> — set your Google user role to admin in the database (Neon SQL Editor).</p></div>'
} else {
  apiFetch('/admin/stats').then(d=>{
    document.getElementById('user-count').textContent = d.userCount
    document.getElementById('company-count').textContent = d.companyCount
  }).catch(e=>{
    document.getElementById('admin-msg').innerHTML = '<p style="color:#c00;">'+e.message+'</p>'
  })
}
</script>
</body>
</html>
