<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SAMS</title>
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>
<header class="site-header">
  <h1 class="page-title"><a href="index.html" class="site-logo">SAMS</a></h1>
  <nav class="auth-nav" id="auth-nav"></nav>
</header>
<div class="auth-form">
  <h2>Login</h2>
  <p class="sub">Google auth only</p>
  <div class="error" id="error"></div>
  <a class="google-btn" href="/api/auth/google">Sign in with Google</a>
  <p><a href="index.html" style="color:#2D4475; text-decoration:none;">← Back to forecast</a></p>
  <p style="color:#999; font-size:0.8rem; margin-top:24px;">Paper trading only — not financial advice.</p>
</div>
<script src="src/auth.js"></script>
<script src="src/nav.js"></script>
<script>
if (getAuth()) location.href = 'dashboard.html';
const err = new URLSearchParams(location.search).get('error');
if (err) document.getElementById('error').textContent = err;
</script>
</body>
</html>
