<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… — SAMS</title>
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>
<header class="site-header">
  <h1 class="page-title"><a href="index.html" class="site-logo">SAMS</a></h1>
</header>
<div style="text-align:center; padding:60px 24px; color:#666;"><p>Completing Google sign-in…</p></div>
<script src="src/auth.js"></script>
<script>
const params = new URLSearchParams(window.location.search)
const token = params.get('token')
if (token) {
  fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => { if (!r.ok) throw new Error('auth failed'); return r.json() })
    .then(user => {
      setAuth({ token, user })
      location.href = 'dashboard.html'
    })
    .catch(() => { clearAuth(); location.href = 'login.html?error=Google+auth+failed' })
} else {
  location.href = 'login.html?error=Missing+token'
}
</script>
</body>
</html>
